on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up PHP
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json
          tools: composer, box

      # Install dependencies
      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-progress --classmap-authoritative

      # Build the .phar file (fetches the blueprint schema, then runs box compile)
      - name: Build .phar
        run: composer build

      # Upload the .phar file as an artifact
      - name: Upload .phar artifact
        uses: actions/upload-artifact@v4
        with:
          name: omeka-s-cli.phar
          path: bin/omeka-s-cli.phar

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Download the .phar artifact
      - name: Download .phar artifact
        uses: actions/download-artifact@v4
        with:
          name: omeka-s-cli.phar

      # Upload the .phar file to the GitHub release
      #
      # A hyphen in the tag marks a prerelease (v1.0.0-beta.0); stable tags never contain one.
      # Prereleases must stay out of 'releases/latest', which is what 'self-update' and the
      # download link in the README resolve to.
      - name: Upload .phar to release
        uses: ncipollo/release-action@v1
        with:
          artifacts: omeka-s-cli.phar
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          makeLatest: ${{ !contains(github.ref_name, '-') }}
