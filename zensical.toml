# Documentation site, built with Zensical (https://zensical.org).
#
#   composer docs:serve   live preview on http://localhost:8000
#   composer docs:build   static site in site/
#
# The command reference is generated from the code into build/docs/ (composer docs:reference) and
# embedded in the pages with snippet includes; the examples are runnable scripts in docs/examples/,
# tested by tests/docs-examples.sh. See AGENTS.md (Documentation).

[project]
site_name = "Omeka-S-Cli"
site_description = "Command line tool to install, configure and maintain Omeka S instances."
site_url = "https://ghentcdh.github.io/Omeka-S-Cli/"
repo_url = "https://github.com/GhentCDH/Omeka-S-Cli"
repo_name = "GhentCDH/Omeka-S-Cli"
edit_uri = "edit/main/docs/"
copyright = "MIT License · Ghent Centre for Digital Humanities"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "installation.md",
    "usage.md",
  ] },
  { "Commands" = [
    "commands/core.md",
    "commands/modules.md",
    "commands/themes.md",
    "commands/users.md",
    "commands/sites.md",
    "commands/settings.md",
    "commands/vocabularies.md",
    "commands/custom-vocabularies.md",
    "commands/resource-templates.md",
    "commands/code-snippets.md",
    "commands/dummy-data.md",
    "commands/blueprints.md",
  ] },
  { "Install automation" = [
    "automation/index.md",
    "automation/bash.md",
    "automation/blueprints.md",
  ] },
  { "Reference" = [
    "reference/global-options.md",
  ] },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
# examples (docs/examples/*.sh) and the generated reference (build/docs/) are included from the
# repository root; a missing file or section fails the build
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
